<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="NEON DRIFT cover art">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#03040f"/>
      <stop offset="0.6" stop-color="#0a0a20"/>
      <stop offset="1" stop-color="#12061f"/>
    </linearGradient>
    <linearGradient id="hglow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff3d9a" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ff3d9a"/>
      <stop offset="1" stop-color="#ff3d9a" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="vig" cx="0.5" cy="0.45" r="0.8">
      <stop offset="0" stop-color="#02030a" stop-opacity="0"/>
      <stop offset="1" stop-color="#02030a" stop-opacity="0.82"/>
    </radialGradient>
    <filter id="b3" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="b7" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="7"/></filter>
  </defs>

  <rect width="640" height="400" fill="url(#bg)"/>

  <!-- stars -->
  <g fill="#dfe8ff">
    <circle cx="80" cy="40" r="1.4" opacity="0.7"/><circle cx="190" cy="76" r="1.1" opacity="0.5"/>
    <circle cx="300" cy="34" r="1.3" opacity="0.6"/><circle cx="420" cy="66" r="1" opacity="0.4"/>
    <circle cx="560" cy="140" r="1.2" opacity="0.5"/><circle cx="60" cy="130" r="1.2" opacity="0.5"/>
  </g>

  <!-- moon -->
  <circle cx="520" cy="88" r="46" fill="#ff3d9a" opacity="0.22" filter="url(#b7)"/>
  <circle cx="520" cy="88" r="30" fill="#ff2e88" opacity="0.85"/>
  <circle cx="512" cy="82" r="7" fill="#c9146a" opacity="0.9"/>
  <circle cx="530" cy="96" r="4.5" fill="#c9146a" opacity="0.8"/>

  <!-- skyline -->
  <g fill="#0b0e26">
    <rect x="36" y="168" width="30" height="44"/><rect x="76" y="148" width="20" height="64"/>
    <rect x="106" y="180" width="34" height="32"/><rect x="168" y="160" width="24" height="52"/>
    <rect x="430" y="170" width="24" height="42"/><rect x="462" y="152" width="30" height="60"/>
    <rect x="502" y="176" width="20" height="36"/><rect x="552" y="158" width="26" height="54"/>
    <rect x="590" y="172" width="22" height="40"/>
  </g>
  <g fill="#2ee6ff" opacity="0.85">
    <rect x="82" y="156" width="3" height="4"/><rect x="88" y="166" width="3" height="4"/>
    <rect x="468" y="162" width="3" height="4"/><rect x="476" y="172" width="3" height="4"/>
    <rect x="558" y="166" width="3" height="4"/>
  </g>
  <g fill="#ff3d9a" opacity="0.8">
    <rect x="174" y="168" width="3" height="4"/><rect x="596" y="180" width="3" height="4"/>
  </g>

  <!-- horizon glow -->
  <rect x="0" y="208" width="640" height="5" fill="url(#hglow)"/>
  <rect x="0" y="204" width="640" height="14" fill="#ff3d9a" opacity="0.25" filter="url(#b7)"/>

  <!-- road -->
  <polygon points="320,212 120,400 520,400" fill="#05070f"/>
  <polygon points="320,212 120,400 520,400" fill="#2ee6ff" opacity="0.05"/>

  <!-- cross grid -->
  <g stroke="#2ee6ff" stroke-width="1.6" opacity="0.35">
    <path d="M301 230 H339 M286 244 H354 M267 262 H373 M243 284 H397 M214 312 H426 M177 346 H463 M139 382 H501"/>
  </g>

  <!-- road edges -->
  <g>
    <path d="M320 212 L120 400" stroke="#2ee6ff" stroke-width="8" opacity="0.35" filter="url(#b7)"/>
    <path d="M320 212 L520 400" stroke="#ff3d9a" stroke-width="8" opacity="0.35" filter="url(#b7)"/>
    <path d="M320 212 L120 400" stroke="#2ee6ff" stroke-width="3"/>
    <path d="M320 212 L520 400" stroke="#ff3d9a" stroke-width="3"/>
  </g>

  <!-- center dashes -->
  <path d="M320 216 L320 400" stroke="#ffc63d" stroke-width="3" stroke-dasharray="10 16" opacity="0.85"/>

  <!-- speed streaks -->
  <g stroke="#2ee6ff" stroke-width="2" opacity="0.4">
    <path d="M40 186 H140"/><path d="M420 196 H500"/><path d="M220 178 H290"/>
  </g>

  <!-- car (rear view) -->
  <g>
    <ellipse cx="330" cy="340" rx="46" ry="9" fill="#ff3d9a" opacity="0.5" filter="url(#b7)"/>
    <polygon points="316,306 344,306 352,334 308,334" fill="#0c1030" stroke="#2ee6ff" stroke-width="2" stroke-linejoin="round"/>
    <rect x="320" y="309" width="20" height="7" fill="#05070f" opacity="0.95"/>
    <rect x="308" y="326" width="10" height="4" fill="#ff2e6e"/>
    <rect x="342" y="326" width="10" height="4" fill="#ff2e6e"/>
    <rect x="306" y="324" width="14" height="8" fill="#ff2e6e" opacity="0.5" filter="url(#b3)"/>
    <rect x="340" y="324" width="14" height="8" fill="#ff2e6e" opacity="0.5" filter="url(#b3)"/>
    <rect x="316" y="338" width="28" height="5" fill="#05070f"/>
    <circle cx="320" cy="342" r="3.4" fill="#0a0f22" stroke="#2ee6ff" stroke-width="1.4"/>
    <circle cx="340" cy="342" r="3.4" fill="#0a0f22" stroke="#2ee6ff" stroke-width="1.4"/>
  </g>

  <rect width="640" height="400" fill="url(#vig)"/>
</svg>