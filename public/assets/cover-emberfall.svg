<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="EMBERFALL cover art">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#080409"/>
      <stop offset="0.6" stop-color="#180a0e"/>
      <stop offset="1" stop-color="#2a0e0e"/>
    </linearGradient>
    <radialGradient id="moon" cx="0.45" cy="0.4" r="0.75">
      <stop offset="0" stop-color="#ffb37a"/>
      <stop offset="0.5" stop-color="#c22a1e"/>
      <stop offset="1" stop-color="#55100f"/>
    </radialGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff1e0"/>
      <stop offset="0.45" stop-color="#ffd9c9"/>
      <stop offset="0.8" stop-color="#ff7a3c"/>
      <stop offset="1" stop-color="#5a1a12"/>
    </linearGradient>
    <radialGradient id="vig" cx="0.5" cy="0.45" r="0.8">
      <stop offset="0" stop-color="#050203" stop-opacity="0"/>
      <stop offset="1" stop-color="#050203" stop-opacity="0.82"/>
    </radialGradient>
    <filter id="b6" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="b12" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="12"/></filter>
  </defs>

  <rect width="640" height="400" fill="url(#bg)"/>

  <!-- stars -->
  <g fill="#f3d9c9">
    <circle cx="70" cy="46" r="1.4" opacity="0.7"/><circle cx="160" cy="90" r="1.1" opacity="0.45"/>
    <circle cx="250" cy="40" r="1.3" opacity="0.6"/><circle cx="330" cy="92" r="1" opacity="0.4"/>
    <circle cx="560" cy="50" r="1.4" opacity="0.65"/><circle cx="606" cy="112" r="1.1" opacity="0.45"/>
    <circle cx="472" cy="34" r="1.2" opacity="0.55"/><circle cx="390" cy="60" r="1" opacity="0.4"/>
  </g>

  <!-- blood moon -->
  <circle cx="430" cy="142" r="102" fill="#55100f" opacity="0.7" filter="url(#b12)"/>
  <circle cx="430" cy="142" r="100" fill="url(#moon)"/>
  <g fill="#7a1d12" opacity="0.4">
    <circle cx="392" cy="110" r="14"/><circle cx="462" cy="128" r="20"/>
    <circle cx="420" cy="176" r="17"/><circle cx="478" cy="184" r="10"/>
    <circle cx="392" cy="152" r="8"/>
  </g>

  <!-- far ridge -->
  <path d="M0 246 L90 214 L170 240 L260 208 L350 242 L440 218 L540 244 L640 222 L640 400 L0 400 Z" fill="#120709"/>

  <!-- near ridge with rim light -->
  <path d="M0 320 L80 268 L150 304 L232 250 L320 300 L400 264 L482 310 L570 274 L640 314 L640 400 L0 400 Z" fill="#1c0a0c"/>
  <path d="M0 320 L80 268 L150 304 L232 250 L320 300 L400 264 L482 310 L570 274 L640 314" fill="none" stroke="#ff6a3c" stroke-width="2" opacity="0.45"/>

  <!-- swords -->
  <g>
    <ellipse cx="212" cy="356" rx="92" ry="20" fill="#ff5a3c" opacity="0.16" filter="url(#b12)"/>
    <path d="M212 84 L223 296 L212 332 L201 296 Z" fill="url(#blade)" opacity="0.9" filter="url(#b6)"/>
    <path d="M212 84 L223 296 L212 332 L201 296 Z" fill="url(#blade)"/>
    <path d="M212 92 L212 322" stroke="#fff1e0" stroke-width="2" opacity="0.7"/>
    <rect x="178" y="300" width="68" height="13" rx="4" fill="#3a2030" stroke="#ffb27a" stroke-width="1.6"/>
    <rect x="205" y="313" width="14" height="52" rx="5" fill="#2a1620" stroke="#7a3a2a" stroke-width="1.4"/>
    <circle cx="212" cy="372" r="9" fill="#ff7a3c"/>
    <circle cx="212" cy="372" r="9" fill="none" stroke="#fff1e0" stroke-width="1.5" opacity="0.7"/>
  </g>

  <!-- embers -->
  <g>
    <circle cx="150" cy="230" r="2.4" fill="#ffc63d" opacity="0.9"/>
    <circle cx="320" cy="196" r="1.8" fill="#ff8a4d" opacity="0.8"/>
    <circle cx="360" cy="266" r="2.8" fill="#ff5a3c" opacity="0.85" filter="url(#b6)"/>
    <circle cx="270" cy="288" r="2" fill="#ffc63d" opacity="0.7"/>
    <circle cx="520" cy="240" r="2.4" fill="#ff8a4d" opacity="0.8"/>
    <circle cx="560" cy="300" r="1.7" fill="#ffc63d" opacity="0.6"/>
    <circle cx="90" cy="290" r="2.2" fill="#ff5a3c" opacity="0.7"/>
    <circle cx="450" cy="300" r="2.6" fill="#ff8a4d" opacity="0.75" filter="url(#b6)"/>
    <circle cx="600" cy="200" r="1.8" fill="#ffc63d" opacity="0.65"/>
    <circle cx="196" cy="330" r="2" fill="#ffc63d" opacity="0.8"/>
    <circle cx="404" cy="352" r="2.4" fill="#ff8a4d" opacity="0.7"/>
    <circle cx="330" cy="330" r="1.6" fill="#ffc63d" opacity="0.6"/>
    <circle cx="500" cy="332" r="2" fill="#ff5a3c" opacity="0.6"/>
    <circle cx="60" cy="200" r="1.6" fill="#ff8a4d" opacity="0.6"/>
  </g>

  <rect width="640" height="400" fill="url(#vig)"/>
</svg>